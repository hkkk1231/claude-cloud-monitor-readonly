name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Test
        shell: powershell
        run: ./test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: bin/